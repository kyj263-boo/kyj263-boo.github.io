# Netlify 배포 설정
# - publish: 공개 출력 폴더 (빌드 스크립트가 생성). 서버 함수는 여기에 복사하지 않는다.
# - functions: 서버리스 함수 소스 폴더. publish 폴더와 분리되어 공개 출력에 섞이지 않는다.

[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # 서버 함수 번들은 공개 영역이 아니며, service_role 키 '값'이 아니라 환경변수 '이름'
  # 문자열(process.env.SUPABASE_SERVICE_ROLE_KEY)만 들어 있다. 이 영역만 비밀 스캔에서 제외한다.
  # 공개 폴더(public)는 계속 스캔된다 → 실제 공개 노출 방지는 그대로 유지.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/functions-internal/**,.netlify/functions/**,netlify/functions/**"

# 함수 디렉터리 (기본 Node 런타임)
# @supabase/supabase-js 를 번들에 확실히 포함시켜 배포 환경에서 import 누락을 방지한다.
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@supabase/supabase-js"]

# 루트(/) 첫 화면은 빌드 단계에서 public/index.html을 food.html 내용으로 덮어써서 처리한다.
# (scripts/build.mjs 참고) 따라서 별도 리다이렉트는 두지 않는다.
